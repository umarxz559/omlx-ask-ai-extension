[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omlx-voice-bridge"
version = "0.3.0"
description = "External FastAPI bridge for oMLX Ask AI: Qwen chat + LFM3 speech"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["voice_bridge"]
